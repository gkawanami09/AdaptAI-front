name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: >-
          docker build
          --build-arg VITE_API_URL=https://api.example.invalid
          --tag adaptai-front:ci
          .
